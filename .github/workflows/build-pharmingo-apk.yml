name: Build Pharmingo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-pharmingo-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon -p android-wrapper assembleDebug

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmingo-debug-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
